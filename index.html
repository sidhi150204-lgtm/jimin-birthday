<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jimin's Birthday 💜 Board</title>
<meta name="description" content="Countdown to Park Jimin's birthday, 13 October. Photos, wishes and music.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <a class="brand" href="#hero">💜 Jimin Day</a>
  <nav>
    <a href="#hero">Countdown</a>
    <a href="#board">Photos</a>
    <a href="#wishes">Wishes</a>
  </nav>
</header>

<main>
  <section class="hero" id="hero">
    <div class="ghost" aria-hidden="true">지민</div>
    <div class="hero-inner">
      <h1 id="headline">Jimin turns 31 in</h1>
      <div class="clock" id="clock" role="timer" aria-live="off">
        <div class="unit"><span id="d">00</span><small>days</small></div>
        <div class="unit"><span id="h">00</span><small>hours</small></div>
        <div class="unit"><span id="m">00</span><small>minutes</small></div>
        <div class="unit"><span id="s">00</span><small>seconds</small></div>
      </div>
      <p class="sub" id="sub"></p>
    </div>
  </section>

  <section class="section" id="board">
    <h2>Jimin board</h2>
    <div class="board" id="pins"></div>
  </section>

  <section class="section" id="wishes">
    <h2>Wishes for Jimin</h2>
    <div class="board">
      <div class="pin form-pin">
        <label for="who">Your name</label>
        <input id="who" maxlength="30" placeholder="Your name or ARMY username" autocomplete="off">
        <label for="msg">Your wish</label>
        <textarea id="msg" maxlength="200" rows="4" placeholder="Happy birthday Jimin! Thank you for…"></textarea>
        <div class="form-row">
          <span id="count">0 / 200</span>
          <button id="send" type="button">Post wish</button>
        </div>
      </div>
      <div id="wall" class="wall-items"></div>
    </div>
    <p class="empty" id="empty">No wishes yet. Write the first one.</p>
  </section>
</main>

<footer>
  <p>Made with 💜 by an ARMY. Fan project, not affiliated with HYBE or BTS.</p>
  <button id="preview" type="button" class="link">Preview birthday mode</button>
</footer>

<!-- music -->
<button id="musicBtn" class="music-btn" type="button" hidden aria-expanded="false">🎵 Music</button>
<div id="musicPanel" class="music-panel" hidden></div>

<!-- photo viewer -->
<div id="lb" class="lb" hidden>
  <button id="lbClose" class="lb-x" aria-label="Close">✕</button>
  <button id="lbPrev" class="lb-nav lb-prev" aria-label="Previous photo">‹</button>
  <img id="lbImg" alt="">
  <button id="lbNext" class="lb-nav lb-next" aria-label="Next photo">›</button>
  <p id="lbCap"></p>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
